<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notre stock · ForeverCars (maquette v3)</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/dropdown.css" />
    <link rel="stylesheet" href="css/stock.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="wrap">
      <header class="page-head">
        <h1 class="h2 reveal focus">Notre stock</h1>
        <p class="lead reveal" style="--d:120ms">Des véhicules contrôlés, préparés et prêts à partir.</p>
      </header>
      <div class="filters soft reveal" style="--d:200ms" id="filters" role="search"></div>
      <div class="results"><strong id="count" aria-live="polite"></strong><div id="sort-slot"></div></div>
      <div class="stock-grid" id="grid"></div>
      <div class="more" id="more"></div>
    </main>
    <div id="footer"></div>
    <div id="switch"></div>

    <script src="../data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/common.js"></script>
    <script src="js/card.js"></script>
    <script src="js/live.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/dropdown.js"></script>
    <script>
      document.getElementById("header").outerHTML = header("Notre stock");
      document.querySelector(".site-header").classList.add("solid");
      document.getElementById("footer").outerHTML = footer();
      document.getElementById("switch").outerHTML = mockSwitch("Stock");
    </script>
    <script src="js/stock.js"></script>
  </body>
</html>
